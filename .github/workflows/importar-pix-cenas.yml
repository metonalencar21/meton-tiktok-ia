name: Importar cenas de Pix cinematograficas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/importar-pix-cenas.yml']
permissions: {contents: write}
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Importar os tres quadros CGI da propria conta
        env:
          SOURCE_LIGACAO: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/fa3e34d7-14e8-47e3-aa29-d0af9e58c636/cf64b599-bddd-4b50-96fa-37ff1f35d408/Use__avatar_as_the_exact_same_stylish_young_adult_female_CGI.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjAwNjc2NWU4MDMwNjI4OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI5MDY1NH0.vkuK3FKLBePRjXIgItDRRMgwkTtMarSj3CmJZle0PQI'
          SOURCE_BLOQUEIO: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/6c991fdf-bf7c-460b-9106-7e22eedda87c/f3fc4228-f1a7-4554-841b-7506e02f2e99/Use__avatar_as_exactly_the_SAME_female_high_end_stylized_3D_.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDFmODU3YjBiMDMzNTQ5OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI3OTIxNn0.aZE3qTEuVTo3mhYIr1KRB3v26MUekvpyZEpzG7QPpKE'
          SOURCE_RESOLUCAO: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/91eb4113-8928-4267-adf9-8cfa4fc2ae10/8eae98ed-f250-49c2-9e84-1f15719f8742/Use__avatar_as_EXACT_SAME_friendly_female_3D_CGI_animated_pr.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWIwZDBhYTA5YzA4ZTdjMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDMzNTUyMH0.ctmzbohOLiokGpgZg8vubEBywuQGJuwUydY3rncpfHg'
        run: |
          mkdir -p public/assets
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_LIGACAO" -o public/assets/personagem-ligacao.jpg
          test "$(stat -c %s public/assets/personagem-ligacao.jpg)" -gt 12000
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_BLOQUEIO" -o public/assets/personagem-bloqueio.jpg
          test "$(stat -c %s public/assets/personagem-bloqueio.jpg)" -gt 12000
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_RESOLUCAO" -o public/assets/personagem-resolucao.jpg
          test "$(stat -c %s public/assets/personagem-resolucao.jpg)" -gt 12000
      - name: Guardar ativos sem links temporarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/personagem-ligacao.jpg public/assets/personagem-bloqueio.jpg public/assets/personagem-resolucao.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'TikTok IA: tres quadros CGI de ligacao, bloqueio e confirmacao [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

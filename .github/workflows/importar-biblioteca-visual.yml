name: Importar biblioteca visual CGI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/importar-biblioteca-visual.yml']
permissions: {contents: write}
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Guardar cenas no repositorio
        env:
          SOURCE_SENHAS: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/9f3a9659-a5be-452e-86b9-72cfeb1e6f50/c3789fcb-230c-410d-9c81-b6fad8d321d3/Use__avatar_as_the_exact_same_young_adult_female_3D_animated.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjdiOWY4YzIzMGViYWNjMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDI4MDc3MH0.Uci6VEp4iwDWog9oP3gQ_hDoWSYoylIm1bOdSYu-Oek'
          SOURCE_PERMISSOES: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/2766c873-0721-414a-a8d1-f2d5cd83295c/83ac03da-1ee8-4a46-9aee-51a96074b86c/Use__avatar_as_the_exact_same_young_adult_female_3D_animated.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWMzMDM1MmE0YmE2YmE5NCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDMyNTI5MH0.gLEs7y8yvTKpINliRgqWfBpTmpkX5NjjAjLPZ1ym5Pk'
          SOURCE_BACKUP: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/e638c369-4028-4ff0-9aec-e00544c22618/fc9bd56c-7a0d-419f-99e6-d37581780ccd/Use__avatar_as_the_exact_same_young_adult_female_3D_animated.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjZlNzViNDU1YWU5MmRiYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDMwMTg5M30.3XYitYIVXDV1oQe7jMBX70Lf9vFBrCCAnyI6RPFmjFk'
        run: |
          mkdir -p public/assets
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_SENHAS" -o public/assets/personagem-senhas.jpg
          test "$(stat -c %s public/assets/personagem-senhas.jpg)" -gt 12000
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_PERMISSOES" -o public/assets/personagem-permissoes.jpg
          test "$(stat -c %s public/assets/personagem-permissoes.jpg)" -gt 12000
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$SOURCE_BACKUP" -o public/assets/personagem-backup.jpg
          test "$(stat -c %s public/assets/personagem-backup.jpg)" -gt 12000
      - name: Registrar biblioteca
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/personagem-senhas.jpg public/assets/personagem-permissoes.jpg public/assets/personagem-backup.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'TikTok IA: biblioteca de cenas CGI para senhas, permissoes e backup [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

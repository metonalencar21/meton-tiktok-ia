name: Quadros reais do piloto cinematico
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-personagem-cinematica.yml'
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Extrair amostras para revisao
        run: |
          ffmpeg -y -loglevel error \
            -i public/pilotos/piloto_personagem_cinematica.mp4 \
            -vf 'fps=1/4,scale=270:480:flags=lanczos,tile=2x2' \
            -frames:v 1 -q:v 4 public/pilotos/personagem_cinematica_preview.jpg
          test -s public/pilotos/personagem_cinematica_preview.jpg
      - name: Salvar previsualizacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pilotos/personagem_cinematica_preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'TikTok IA: imagem de inspecao do piloto CGI [skip ci]'
            git push origin HEAD:main
          fi

name: Piloto v2 - historia visual antes de publicar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/story_pilot.py'
      - 'scripts/produce.py'
      - '.github/workflows/testar-piloto.yml'

permissions:
  contents: write

concurrency:
  group: meton-piloto-v2
  cancel-in-progress: false

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar dependencias gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validar codigo e conteudo
        run: |
          python -m compileall -q scripts tests
          python tests/test_bank.py
      - name: Gerar piloto completo com cenas especificas
        run: |
          python scripts/story_pilot.py --output public/pilotos/historia-voz-clonada-v2.mp4
      - name: Validar video de revisao
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("public/pilotos/historia-voz-clonada-v2.mp4")
          m=json.loads(p.with_suffix(".json").read_text(encoding="utf-8"))
          assert p.is_file() and p.stat().st_size>100000
          assert m["scenes"]==8
          assert m["voice_engine"]=="edge-tts"
          assert 70<=m["duration_s"]<=120
          assert m["animated"] and m["quality_review_required"]
          assert not m["approved"] and not m["published"]
          v=json.loads(subprocess.check_output([
            "ffprobe","-v","error","-show_entries",
            "format=duration:stream=codec_type,codec_name,width,height,avg_frame_rate",
            "-of","json",str(p)]))
          assert len(v["streams"])==2
          print("PILOTO 2 VALIDADO",m["duration_s"],"segundos",p.stat().st_size,"bytes")
          PY
      - name: Armazenar artefato de avaliacao
        uses: actions/upload-artifact@v4
        with:
          name: historia-voz-clonada-v2
          path: |
            public/pilotos/historia-voz-clonada-v2.mp4
            public/pilotos/historia-voz-clonada-v2.json
          retention-days: 14
          if-no-files-found: error
      - name: Salvar piloto no GitHub sem publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::Houve nova alteracao; piloto disponivel no artefato, sem sobrescrever repositorio."
            exit 0
          fi
          git add public/pilotos/historia-voz-clonada-v2.mp4 public/pilotos/historia-voz-clonada-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Piloto v2 com encenacao e voz neural [skip ci]'
            git push origin HEAD:main
          fi

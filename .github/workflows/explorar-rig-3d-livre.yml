name: Explorar rig 3D livre para a personagem oficial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_character_rig.py'
      - '.github/workflows/explorar-rig-3d-livre.yml'

permissions:
  contents: read

jobs:
  inventariar-rig-sem-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIG_POINTER_URL: https://projects.blender.org/blender/blender-benchmarks/raw/branch/main/animation/rain/rain.blend
      RIG_LFS_BATCH_URL: https://projects.blender.org/blender/blender-benchmarks.git/info/lfs/objects/batch
      RIG_LICENSE: CC-BY-4.0
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Blender livre
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender

      - name: Resolver ponteiro Git LFS e baixar somente o rig
        run: |
          mkdir -p .development public/development
          curl --fail --location --retry 3 --output .development/rain.pointer "$RIG_POINTER_URL"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          from urllib.request import Request, urlopen

          pointer = Path(".development/rain.pointer").read_text(encoding="utf-8")
          values = {}
          for line in pointer.splitlines():
              if line.startswith("oid sha256:"):
                  values["oid"] = line.split(":", 1)[1]
              elif line.startswith("size "):
                  values["size"] = int(line.split()[1])
          if set(values) != {"oid", "size"}:
              raise SystemExit("A fonte não devolveu um ponteiro Git LFS válido")

          body = json.dumps({
              "operation": "download",
              "transfers": ["basic"],
              "objects": [{"oid": values["oid"], "size": values["size"]}],
          }).encode()
          request = Request(
              os.environ["RIG_LFS_BATCH_URL"],
              data=body,
              headers={
                  "Accept": "application/vnd.git-lfs+json",
                  "Content-Type": "application/vnd.git-lfs+json",
              },
              method="POST",
          )
          with urlopen(request, timeout=60) as response:
              batch = json.load(response)
          action = batch["objects"][0]["actions"]["download"]
          download = Request(action["href"], headers=action.get("header", {}))
          with urlopen(download, timeout=180) as response, open(".development/rain.blend", "wb") as target:
              shutil.copyfileobj(response, target)

          actual_size = Path(".development/rain.blend").stat().st_size
          digest = hashlib.sha256(Path(".development/rain.blend").read_bytes()).hexdigest()
          if actual_size != values["size"] or digest != values["oid"]:
              raise SystemExit("Rig baixado não corresponde ao ponteiro oficial")
          Path("public/development/rig-source.sha256").write_text(
              f"{digest}  rain.blend\n", encoding="utf-8"
          )
          print(json.dumps({"bytes": actual_size, "sha256": digest}))
          PY

      - name: Inventariar malha, ossos e expressões
        id: inspect
        continue-on-error: true
        run: |
          blender -b .development/rain.blend \
            --python scripts/inspect_character_rig.py -- \
            --output public/development/rig-inventory.json \
            --source "$RIG_POINTER_URL" \
            --license "$RIG_LICENSE"

      - name: Guardar somente evidências técnicas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-rig-3d-livre
          path: |
            public/development/rig-inventory.json
            public/development/rig-source.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Registrar limites da prova
        if: always()
        shell: bash
        run: |
          {
            echo '## Exploração de rig 3D — não é liberação'
            echo
            echo '- Fonte: Blender Foundation, benchmark Rain, CC-BY 4.0.'
            echo '- Objetivo: verificar se há malha, esqueleto e controles suficientes para uma adaptação.'
            echo '- O personagem Rain não é a identidade aprovada do canal.'
            echo '- Nenhum MP4 foi publicado ou enviado ao Metricool.'
            echo '- Próximo passo, se o inventário passar: mapear cabelo, rosto, roupa e controles para uma adaptação visual própria.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Falhar se o ativo não tiver capacidade mínima
        if: steps.inspect.outcome != 'success'
        run: |
          echo "::error::O rig gratuito não atingiu a capacidade técnica mínima. Não usar como personagem final."
          exit 1

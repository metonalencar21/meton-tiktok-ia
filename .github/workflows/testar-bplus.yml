name: Validar piloto B+ NEXO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/visual_bplus.py'
      - 'tests/test_bplus.py'
      - '.github/workflows/testar-bplus.yml'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Validar arquivo e narrativa B+
        run: python -m tests.test_bplus

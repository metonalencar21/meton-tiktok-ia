name: Importar personagem-mestre cinematografica
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importar-personagem-mestre.yml'
permissions:
  contents: write
jobs:
  salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Salvar referencia permanente
        env:
          ASSET_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/9677c3b7-e4bc-44e7-b070-9570e5926543/ce1eee47-86be-4adc-80c3-dadef4a49f56/Create_a_single_highly_polished_high_end_cinematic_CGI_3D_he.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDlhY2VjNmY3NTk2OGJkNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDMwMjE5MX0.GBNY4HkrNeIg8uWV6fQuyLrGYaQA84HKRgKBu1s_8Pc'
        run: |
          mkdir -p public/assets
          curl --fail --silent --show-error --location --retry 3 --max-time 120 "$ASSET_URL" -o public/assets/personagem-mestre.jpg
          test "$(stat -c %s public/assets/personagem-mestre.jpg)" -gt 12000
          file public/assets/personagem-mestre.jpg
      - name: Publicar asset no proprio repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/personagem-mestre.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'TikTok IA: guardar personagem feminina 3D mestre [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
